<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" style="background:#0b1120; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Title & Caption -->
  <text x="50" y="30" fill="#f8fafc" font-size="16" font-weight="bold">Figure 5(b) Modeled from Research Paper: Simplified Multi-Core State Transition Graph (MSTG)</text>
  <text x="50" y="48" fill="#94a3b8" font-size="12">Reference: Entrup et al., Real-Time Systems (2024), Section 3.2 (Page 12)</text>

  <!-- Core Track Lines -->
  <text x="50" y="90" fill="#94a3b8" font-size="14" font-weight="bold">Core 0 (TaskA)</text>
  <line x1="160" y1="85" x2="950" y2="85" stroke="#334155" stroke-dasharray="4" />

  <text x="50" y="210" fill="#94a3b8" font-size="14" font-weight="bold">Cross-Core Sync</text>
  <line x1="160" y1="205" x2="950" y2="205" stroke="#334155" stroke-dasharray="4" />

  <text x="50" y="330" fill="#94a3b8" font-size="14" font-weight="bold">Core 1 (TaskD)</text>
  <line x1="160" y1="325" x2="950" y2="325" stroke="#334155" stroke-dasharray="4" />

  <!-- Root SP (SP a) -->
  <circle cx="200" cy="205" r="18" fill="#8b5cf6" stroke="#fff" stroke-width="2" />
  <text x="187" y="210" fill="#fff" font-size="13" font-weight="bold">SP a</text>
  <text x="165" y="240" fill="#c084fc" font-size="11">Root State</text>

  <!-- Branch to Core 1 Syscall -->
  <path d="M 218 205 L 340 325" stroke="#ef4444" stroke-width="3" marker-end="url(#arrow-red)" />
  <text x="235" y="285" fill="#ef4444" font-size="11" font-weight="bold">cross syscall (AT)</text>

  <!-- Core 1 ABB 10 (Yellow) -->
  <rect x="340" y="305" width="160" height="40" rx="6" fill="#eab308" opacity="0.9" />
  <text x="355" y="330" fill="#000" font-size="13" font-weight="bold">Core 1: ABB 10 (TaskD)</text>
  <text x="385" y="365" fill="#94a3b8" font-size="11">interval: [5, 12] ms</text>

  <!-- SP b -->
  <circle cx="560" cy="205" r="18" fill="#8b5cf6" stroke="#fff" stroke-width="2" />
  <text x="547" y="210" fill="#fff" font-size="13" font-weight="bold">SP b</text>

  <!-- Core 1 joins SP b -->
  <path d="M 500 325 L 545 215" stroke="#ef4444" stroke-width="3" marker-end="url(#arrow-red)" />

  <!-- SP b wakes Core 0 -->
  <path d="M 575 195 L 650 90" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow-blue)" />
  <text x="580" y="130" fill="#38bdf8" font-size="11" font-weight="bold">Wakeup Core 0</text>

  <!-- Core 0 ABB 21 (Blue) -->
  <rect x="650" y="65" width="160" height="40" rx="6" fill="#38bdf8" opacity="0.9" />
  <text x="665" y="90" fill="#000" font-size="13" font-weight="bold">Core 0: ABB 21 (TaskA)</text>
  <text x="695" y="125" fill="#94a3b8" font-size="11">interval: [8, 15] ms</text>

  <!-- Core 1 continues concurrent execution (Green ABB 11) -->
  <path d="M 575 215 L 650 325" stroke="#22c55e" stroke-width="3" marker-end="url(#arrow-gray)" />
  <rect x="650" y="305" width="160" height="40" rx="6" fill="#22c55e" opacity="0.9" />
  <text x="665" y="330" fill="#000" font-size="13" font-weight="bold">Core 1: ABB 11 (TaskE)</text>
  <text x="695" y="365" fill="#94a3b8" font-size="11">interval: [10, 20] ms</text>

  <!-- SP c: Lock Evaluation -->
  <circle cx="890" cy="205" r="18" fill="#8b5cf6" stroke="#fff" stroke-width="2" />
  <text x="877" y="210" fill="#fff" font-size="13" font-weight="bold">SP c</text>
  <text x="840" y="240" fill="#22c55e" font-size="11" font-weight="bold">Lock Elision Point</text>

  <path d="M 810 85 L 875 195" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow-gray)" />
  <path d="M 810 325 L 875 215" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow-gray)" />

  <!-- Bottom Legend -->
  <rect x="50" y="385" width="14" height="14" fill="#8b5cf6" rx="3" />
  <text x="70" y="397" fill="#94a3b8" font-size="11">SP (Synchronization Point)</text>

  <rect x="250" y="385" width="14" height="14" fill="#ef4444" rx="3" />
  <text x="270" y="397" fill="#94a3b8" font-size="11">Cross-Core Syscall (Red Line)</text>

  <rect x="470" y="385" width="14" height="14" fill="#38bdf8" rx="3" />
  <text x="490" y="397" fill="#94a3b8" font-size="11">Core Computation ABB</text>

  <rect x="670" y="385" width="14" height="14" fill="#22c55e" rx="3" />
  <text x="690" y="397" fill="#94a3b8" font-size="11">Lock Elision Safe Point</text>
</svg>
